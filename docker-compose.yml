name: byte-quest

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: tenuka22/byte-quest:latest
    init: true
    ports:
      - "${WEB_PORT:-5001}:${WEB_PORT:-5001}"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      PORT: ${WEB_PORT:-5001}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:5001}
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-libsql://byte-quest-tenuka22.aws-ap-northeast-1.turso.io}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3OTEyOTIyNjUsImlkIjoiMDFhMTExNTYtODUwMS03YTU2LWExZmQtMjFlMjdlNGMxMzU3Iiwia2lkIjoiWHVlS0NQUW9wNVliUnU4Y2ZONzM5a2NrcnNkQmdDZVpUdDlRSDBBRndSRSIsInJpZCI6IjgzNzJjYzE0LTQ4NzMtNGFjYy1iM2UzLThlYzNkM2RmMjZhOCJ9.lPH1-xx65aYyyu36riEv1yzbT2_5vgfVuwj5E8RcA8dyJRIYC8Cd8GETq-biK6P-5TFIzTIm1ywLUEfu7Ac-Cg}
    volumes:
      - db-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  db-data:
