name: byte-quest

# Deploys the image already published to Docker Hub
# (tenuka22/byte-quest), rather than building from this checkout.
# Use this with a platform that only accepts compose YAML with no build
# context attached (Plesk's "Add Stack -> Editor", a bare Docker host, etc).

services:
  web:
    image: tenuka22/byte-quest:${IMAGE_TAG:-latest}
    ports:
      - "4001:4001"
    environment:
      NODE_ENV: production
      TZ: UTC
      PORT: "4001"
      BETTER_AUTH_URL: ${SITE_URL:-https://bytequest.aloysiuscollege.lk}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-REPLACE_ME_32_CHAR_SECRET}
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-libsql://byte-quest-tenuka22.aws-ap-northeast-1.turso.io}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-REPLACE_ME_TURSO_AUTH_TOKEN}
    volumes:
      - byte-quest_data:/app/data
    restart: unless-stopped

volumes:
  byte-quest_data:
