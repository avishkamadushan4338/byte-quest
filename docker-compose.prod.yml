name: byte-quest

# Deploys the image published to GitLab Container Registry
# (registry.gitlab.com/tenuka22/byte-quest), rather than building from this checkout.
# Use this with Portainer, Plesk Docker Extension, or any Docker host.

services:
  web:
    image: registry.gitlab.com/tenuka22/byte-quest:${IMAGE_TAG:-latest}
    init: true
    ports:
      - "${PORT:-5001}:5001"
    environment:
      NODE_ENV: production
      TZ: UTC
      PORT: "5001"
      BETTER_AUTH_URL: ${SITE_URL:-${BETTER_AUTH_URL:-https://bytequest.aloysiuscollege.lk}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-libsql://byte-quest-tenuka22.aws-ap-northeast-1.turso.io}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
